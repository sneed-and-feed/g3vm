[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g3vm"
version = "0.7.0"
description = "G3VM (DarkSnail-Geo3D): 3D Beltrami-Triad Geological Velocity, TTI Elastic & Coupled Seismic-Radar Dielectric Modeler with Interactive Petrel/Leapfrog-Grade 3D Workstation, Out-of-Core SEG-Y Memmap Streaming, Z-Slab Spectral Chunking, so(6) Stiffness Rotors, US DOE Utah FORGE EGS Doublet, Lunar Lava Tube ISRU, and Mode B Blind LOWO Kriging Benchmark"
authors = [{ name = "Noah Cohen" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "flask>=3.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
g3vm = "g3vm.cli:main"

[project.urls]
Homepage = "https://github.com/sneed-and-feed/g3vm"
Repository = "https://github.com/sneed-and-feed/g3vm"
DOI = "https://doi.org/10.5281/zenodo.23488781"

[tool.setuptools.packages.find]
where = ["."]
include = ["g3vm*"]

[tool.setuptools.package-data]
g3vm = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
